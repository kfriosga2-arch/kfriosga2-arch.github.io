<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix TV (Old WebView Fix)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #070709;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            user-select: none;
            font-size: 14px;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: #12121a; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
        }
        .logo { font-size: 20px; font-weight: 900; color: #E50914; letter-spacing: 2px; }
        .main-container { padding: 70px 20px 20px 20px; max-width: 1200px; margin: 0 auto; }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #e5e5e5; }
        .grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .movie-card {
            width: 130px; height: 190px; background: #12121a; border-radius: 4px; overflow: hidden;
            cursor: pointer; position: relative; border: 2px solid transparent; outline: none;
        }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; }
        .movie-card.tv-focused { border-color: #E50914; transform: scale(1.08); z-index: 10; outline: 2px solid #fff; }
        .movie-title {
            position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8);
            font-size: 10px; padding: 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #player-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 20000; flex-direction: column;
        }
        .player-top-bar {
            display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; background: #12121a; height: 40px; z-index: 30;
        }
        .player-close-btn { background: #E50914; color: #fff; border: none; padding: 4px 12px; font-weight: bold; cursor: pointer; border-radius: 3px; outline: none; }
        .player-close-btn.tv-focused { outline: 2px solid #fff; background: #ff1e2b; }
        .player-container-inner { 
            position: absolute; top: 40px; left: 0; right: 0; bottom: 0; width: 100%; height: auto !important; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; flex-grow: 1; 
        }
        .player-container-inner > div { 
            width: 100% !important; height: 100% !important; max-width: 100% !important; max-height: 100% !important; position: absolute !important; top: 0 !important; left: 0 !important; transform: none !important; 
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">NETFLIX TV</div>
    <div style="font-size: 12px; color: #aaa;">Android 9 TV Fix</div>
</div>

<div class="main-container">
    <div class="section-title">🔥 Топ-30 фильмов</div>
    <div class="grid" id="moviesGrid"></div>
</div>

<div id="player-screen">
    <div class="player-top-bar">
        <div id="playerMediaTitle" style="font-size: 12px; font-weight: bold;">Проигрыватель</div>
        <button class="player-close-btn" tabindex="0" onclick="closePlayer()">Закрыть (Назад)</button>
    </div>
    <div class="player-container-inner" id="playerContainerInner"></div>
</div>

<script>
    const staticMovies = [
        { title: "Дюна: Часть вторая", id: 693134, poster: "https://image.tmdb.org/t/p/w200/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg" },
        { title: "Оппенгеймер", id: 872585, poster: "https://image.tmdb.org/t/p/w200/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg" },
        { title: "Бэтмен", id: 414906, poster: "https://image.tmdb.org/t/p/w200/74xTEgt7R36Fpooo50r9T25onhq.jpg" },
        { title: "Интерстеллар", id: 157336, poster: "https://image.tmdb.org/t/p/w200/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" },
        { title: "Начало", id: 27205, poster: "https://image.tmdb.org/t/p/w200/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg" },
        { title: "Джокер", id: 475557, poster: "https://image.tmdb.org/t/p/w200/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg" },
        { title: "Мстители: Финал", id: 299534, poster: "https://image.tmdb.org/t/p/w200/or06FN3Dka5tukK1e9sl16pB3iy.jpg" },
        { title: "Аватар: Путь воды", id: 76600, poster: "https://image.tmdb.org/t/p/w200/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg" },
        { title: "Тёмный рыцарь", id: 155, poster: "https://image.tmdb.org/t/p/w200/qJ2tW6WMUDux911r6m7haRef0WH.jpg" },
        { title: "Гладиатор", id: 98, poster: "https://image.tmdb.org/t/p/w200/ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg" },
        { title: "Побег из Шоушенка", id: 278, poster: "https://image.tmdb.org/t/p/w200/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg" },
        { title: "Зеленая миля", id: 497, poster: "https://image.tmdb.org/t/p/w200/acXzIXS6FvE7mJv4uM3aFhXvO5i.jpg" },
        { title: "Форсаж 10", id: 385687, poster: "https://image.tmdb.org/t/p/w200/1E5baAaEse26fej7uHcjOgEE2t2.jpg" },
        { title: "Человек-паук: Паутина вселенных", id: 569094, poster: "https://image.tmdb.org/t/p/w200/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg" },
        { title: "Криминальное чтиво", id: 680, poster: "https://image.tmdb.org/t/p/w200/vQWk5YBFWF4bzaofAbv0tShvbwv.jpg" },
        { title: "Король Лев", id: 8587, poster: "https://image.tmdb.org/t/p/w200/sKCr78MXSLixwmZ8DyJLrpMsd15.jpg" },
        { title: "Матрица", id: 603, poster: "https://image.tmdb.org/t/p/w200/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg" },
        { title: "Джон Уик 4", id: 603692, poster: "https://image.tmdb.org/t/p/w200/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg" },
        { title: "Бегущий по лезвию 2049", id: 335984, poster: "https://image.tmdb.org/t/p/w200/gajva2L0rPYkEWjzgKlBXCAVRE5.jpg" },
        { title: "Паразиты", id: 496243, poster: "https://image.tmdb.org/t/p/w200/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg" },
        { title: "Властелин колец: Братство Кольца", id: 120, poster: "https://image.tmdb.org/t/p/w200/6oom5QYQ2yQTMJIbnvbkBL9cHo6.jpg" },
        { title: "Форрест Гамп", id: 13, poster: "https://image.tmdb.org/t/p/w200/arw2vcBveWOVZr6pxd9XTd1TdQa.jpg" },
        { title: "Богемская рапсодия", id: 424694, poster: "https://image.tmdb.org/t/p/w200/lHu1wtNmkIFgFdwvPcJCZ7F8yWj.jpg" },
        { title: "Достучаться до небес", id: 110, poster: "https://image.tmdb.org/t/p/w200/q228sY1Y2MebhW1Pz6fB8p2j8gY.jpg" },
        { title: "Амели", id: 194, poster: "https://image.tmdb.org/t/p/w200/n6h5b97h9x1v68m5u0g0z6n6o6.jpg" },
        { title: "Унесенные призраками", id: 129, poster: "https://image.tmdb.org/t/p/w200/39wmItIWsg5sZMyRUHLkWBcuVCM.jpg" },
        { title: "Интервью с вампиром", id: 628, poster: "https://image.tmdb.org/t/p/w200/5g0gD4z7q8b8l9f1f2e3d4c5b6.jpg" },
        { title: "Джентльмены", id: 420818, poster: "https://image.tmdb.org/t/p/w200/2xvC6fF1cWcR6qZ78z39p1Q4y55.jpg" },
        { title: "Волк с Уолл-стрит", id: 106646, poster: "https://image.tmdb.org/t/p/w200/3U0Z4F1Vz912384u59392.jpg" },
        { title: "Престиж", id: 1124, poster: "https://image.tmdb.org/t/p/w200/bdN3gXuIZYaJW7ftKK2sU0nPtEA.jpg" }
    ];

    let currentFocusIndex = 0;
    let focusables = [];

    function initGrid() {
        const grid = document.getElementById('moviesGrid');
        grid.innerHTML = '';
        
        staticMovies.forEach((m) => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.tabIndex = 0;
            card.innerHTML = `
                <img src="${m.poster}" alt="${m.title}" loading="lazy">
                <div class="movie-title">${m.title}</div>
            `;
            card.onclick = () => openPlayer(m);
            grid.appendChild(card);
        });

        updateFocusList();
        updateFocus();
    }

    function updateFocusList() {
        const isPlayerOpen = document.getElementById('player-screen').style.display === 'flex';
        if (isPlayerOpen) {
            focusables = [document.querySelector('.player-close-btn')];
        } else {
            focusables = Array.from(document.querySelectorAll('.movie-card'));
        }
    }

    function updateFocus() {
        document.querySelectorAll('.tv-focused').forEach(el => el.classList.remove('tv-focused'));
        if (focusables[currentFocusIndex]) {
            focusables[currentFocusIndex].classList.add('tv-focused');
            focusables[currentFocusIndex].scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
            try { focusables[currentFocusIndex].focus(); } catch(e) {}
        }
    }

    function openPlayer(movie) {
        document.getElementById('playerMediaTitle').innerText = movie.title;
        document.getElementById('player-screen').style.display = 'flex';
        
        const container = document.getElementById('playerContainerInner');
        container.innerHTML = '';
        const oldScript = document.getElementById('kinobd-script');
        if(oldScript) oldScript.remove();

        updateFocusList();
        currentFocusIndex = 0;
        updateFocus();

        setTimeout(() => {
            const playerDiv = document.createElement('div');
            playerDiv.id = 'kinobd';
            playerDiv.style.width = '100%';
            playerDiv.style.height = '100%';
            playerDiv.setAttribute('data-id', movie.id);
            playerDiv.setAttribute('data-title', movie.title);
            playerDiv.setAttribute('data-token', 'ffa2d75dc51825a6735af4f120544d61');
            container.appendChild(playerDiv);

            const script = document.createElement('script');
            script.id = 'kinobd-script';
            script.src = 'https://kinobd.net/js/player_.js';
            script.async = true;
            document.body.appendChild(script);
        }, 300);
    }

    function closePlayer() {
        document.getElementById('player-screen').style.display = 'none';
        document.getElementById('playerContainerInner').innerHTML = '';
        const oldScript = document.getElementById('kinobd-script');
        if(oldScript) oldScript.remove();

        updateFocusList();
        currentFocusIndex = 0;
        updateFocus();
    }

    window.addEventListener('keydown', function(event) {
        const isPlayerOpen = document.getElementById('player-screen').style.display === 'flex';

        if (isPlayerOpen) {
            if (event.key === 'Escape' || event.key === 'Backspace' || event.keyCode === 8 || event.keyCode === 27) {
                closePlayer();
                event.preventDefault();
            }
            return;
        }

        let cols = 6; // Приблизительное количество карточек в строке для шага по вертикали
        switch(event.key) {
            case 'ArrowRight':
                currentFocusIndex++;
                if (currentFocusIndex >= focusables.length) currentFocusIndex = focusables.length - 1;
                updateFocus();
                event.preventDefault();
                break;
            case 'ArrowLeft':
                currentFocusIndex--;
                if (currentFocusIndex < 0) currentFocusIndex = 0;
                updateFocus();
                event.preventDefault();
                break;
            case 'ArrowDown':
                currentFocusIndex += cols;
                if (currentFocusIndex >= focusables.length) currentFocusIndex = focusables.length - 1;
                updateFocus();
                event.preventDefault();
                break;
            case 'ArrowUp':
                currentFocusIndex -= cols;
                if (currentFocusIndex < 0) currentFocusIndex = 0;
                updateFocus();
                event.preventDefault();
                break;
            case 'Enter':
                if (focusables[currentFocusIndex]) {
                    focusables[currentFocusIndex].click();
                }
                event.preventDefault();
                break;
            case 'Backspace':
            case 'Escape':
                history.back();
                event.preventDefault();
                break;
        }
    });

    window.onload = initGrid;
</script>
</body>
</html>
