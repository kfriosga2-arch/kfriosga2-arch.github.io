<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix & Lampa TV (Grunhelm Edition)</title>
    <style>
        * { box-sizing: border-box; outline: none; }
        :root {
            --netflix-red: #E50914;
            --bg-dark: #0e0e13;
            --bg-card: #16161f;
            --text-main: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: var(--bg-card);
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: bold; color: var(--netflix-red); font-family: Impact, sans-serif; }
        
        .main-container { padding: 90px 30px 30px 30px; max-width: 1400px; margin: 0 auto; }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #e5e5e5; display: flex; justify-content: space-between; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
        .grid-card {
            background: var(--bg-card); border-radius: 6px; overflow: hidden; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.2s, border-color 0.2s;
        }
        .grid-card img { width: 100%; height: 230px; object-fit: cover; display: block; background: #1a1a24; }
        .grid-card-info { padding: 8px; }
        .grid-card-title { font-size: 12px; font-weight: bold; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Фокус с пульта для ТВ */
        .grid-card:focus, .grid-card:hover {
            transform: scale(1.05);
            border-color: var(--netflix-red);
            box-shadow: 0 0 15px rgba(229,9,20,0.6);
        }

        /* Модальное окно выбора для ТВ */
        #tv-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 20000; justify-content: center; align-items: center;
        }
        .tv-modal-content {
            background: var(--bg-card); padding: 30px; border-radius: 10px; width: 500px; max-width: 90%;
            border: 2px solid var(--netflix-red); text-align: center;
        }
        .tv-modal-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .tv-modal-btn {
            background: var(--netflix-red); color: white; border: none; padding: 12px 20px;
            font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px;
        }
        .tv-modal-btn:focus { background: #ff1e2b; outline: 3px solid white; }
        .tv-close-btn { background: #333; margin-top: 10px; }

        #loader-status { font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">NETFLIX & LAMPA TV</div>
    <div id="loader-status">Загрузка каталога...</div>
</div>

<div class="main-container">
    <div class="section-title">
        <span>🎬 Мега-Каталог фильмов (~2000)</span>
    </div>
    <div class="grid" id="catalogGrid"></div>
</div>

<!-- Модальное окно для обхода блокировок WebView на ТВ -->
<div id="tv-modal">
    <div class="tv-modal-content">
        <div class="tv-modal-title" id="modalMovieTitle">Название</div>
        <p style="font-size: 13px; color: #aaa;">Выберите способ запуска на Android 9:</p>
        <button class="tv-modal-btn" id="btnOpenBrowser" tabindex="0">🌐 Открыть через браузер / Плеер</button>
        <button class="tv-modal-btn tv-close-btn" tabindex="0" onclick="closeModal()">✕ Закрыть</button>
    </div>
</div>

<script>
    let cachedCatalog = [];
    let currentSelectedMovie = '';

    // Безопасный запрос через XMLHttpRequest (для старого WebView Android 9)
    function oldApiRequest(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        callback(null, JSON.parse(xhr.responseText));
                    } catch(err) {
                        callback(err, null);
                    }
                } else {
                    callback(new Error('Status: ' + xhr.status), null);
                }
            }
        };
        xhr.onerror = function() { callback(new Error('Network error'), null); };
        xhr.send();
    }

    // Загрузка ~2000 фильмов (80 страниц по 25 результатов)
    function fetchBigCatalog() {
        var multiResults = [];
        var loadedPages = 0;
        var totalPages = 80; 

        document.getElementById('loader-status').innerText = 'Загрузка базы (0/' + totalPages + ')...';

        function checkDone() {
            loadedPages++;
            document.getElementById('loader-status').innerText = 'Загрузка базы (' + loadedPages + '/' + totalPages + ')...';
            
            if (loadedPages >= totalPages) {
                var uniqueMap = {};
                for (var i = 0; i < multiResults.length; i++) {
                    var item = multiResults[i];
                    if (item && item.poster_path && item.id && item.title) {
                        uniqueMap[item.id] = item;
                    }
                }
                cachedCatalog = [];
                for (var key in uniqueMap) {
                    if (uniqueMap.hasOwnProperty(key)) {
                        cachedCatalog.push(uniqueMap[key]);
                    }
                }
                renderGrid(cachedCatalog);
                document.getElementById('loader-status').innerText = 'Фильмов загружено: ' + cachedCatalog.length;
            }
        }

        for (var p = 1; p <= totalPages; p++) {
            (function(page) {
                oldApiRequest('https://api.themoviedb.org/3/movie/popular?api_key=347651bac020bf3af616287e853b4e92&language=ru-RU&page=' + page, function(err, data) {
                    if (!err && data && data.results) {
                        for (var i = 0; i < data.results.length; i++) {
                            multiResults.push(data.results[i]);
                        }
                    }
                    checkDone();
                });
            })(p);
        }
    }

    function renderGrid(list) {
        var c = document.getElementById('catalogGrid');
        c.innerHTML = '';
        for (var i = 0; i < list.length; i++) {
            var m = list[i];
            var title = m.title || 'Без названия';
            var poster = m.poster_path ? 'https://image.tmdb.org/t/p/w500' + m.poster_path : '';
            if (!poster) continue;

            var card = document.createElement('div');
            card.className = 'grid-card';
            card.tabIndex = 0; // Делаем карточку доступной для фокуса с пульта ТВ
            card.innerHTML = '<img src="' + poster + '" alt="' + title + '">' +
                '<div class="grid-card-info">' +
                    '<div class="grid-card-title">' + title + '</div>' +
                '</div>';
            
            // Замыкание для передачи названия
            (function(movTitle) {
                card.onclick = function() { openTvPlayerModal(movTitle); };
            })(title);

            c.appendChild(card);
        }
    }

    function openTvPlayerModal(title) {
        currentSelectedMovie = title;
        document.getElementById('modalMovieTitle').innerText = title;
        document.getElementById('tv-modal').style.display = 'flex';
        // Фокусируем кнопку в модалке для пульта
        document.getElementById('btnOpenBrowser').focus();
    }

    function closeModal() {
        document.getElementById('tv-modal').style.display = 'none';
    }

    // Обработка кнопки запуска плеера внешним методом
    document.getElementById('btnOpenBrowser').onclick = function() {
        var targetUrl = 'https://on.kinohub.vip/search?query=' + encodeURIComponent(currentSelectedMovie);
        // На Android WebView открытие через window.open или прямой переход заставляет систему вызывать доступный браузер/плеер
        window.location.href = targetUrl;
    };

    // Поддержка навигации пульта (кнопка Enter / ОК)
    window.addEventListener('keydown', function(event) {
        if (event.keyCode === 13 || event.keyCode === 32) {
            var active = document.activeElement;
            if (active && typeof active.click === 'function') {
                active.click();
                event.preventDefault();
            }
        }
    });

    // Запуск загрузки
    fetchBigCatalog();
</script>
</body>
</html>
