<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix & Lampa TV</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --netflix-red: #E50914;
            --bg-dark: #0e0e13;
            --bg-card: #16161f;
            --text-main: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: var(--bg-card);
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: bold; color: var(--netflix-red); font-family: Impact, sans-serif; }
        
        .main-container { padding: 90px 30px 30px 30px; max-width: 1400px; margin: 0 auto; }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #e5e5e5; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
        .grid-card {
            background: var(--bg-card); border-radius: 6px; overflow: hidden; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.2s, border-color 0.2s;
        }
        .grid-card img { width: 100%; height: 230px; object-fit: cover; display: block; background: #1a1a24; }
        .grid-card-info { padding: 8px; }
        .grid-card-title { font-size: 12px; font-weight: bold; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .grid-card:hover { transform: scale(1.05); border-color: var(--netflix-red); }

        #player-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 20000; flex-direction: column; }
        .player-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--bg-card); }
        .player-close-btn { background: var(--netflix-red); color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #player-frame { width: 100%; height: 100%; border: none; flex: 1; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">NETFLIX & LAMPA</div>
</div>

<div class="main-container">
    <div class="section-title">🎬 Популярные фильмы</div>
    <div class="grid" id="catalogGrid"></div>
</div>

<div id="player-screen">
    <div class="player-top-bar">
        <span id="playerMediaTitle" style="font-size: 14px; font-weight: bold;">Просмотр</span>
        <button class="player-close-btn" onclick="closePlayer()">✕ Закрыть</button>
    </div>
    <iframe id="player-frame" src="" allowfullscreen></iframe>
</div>

<script>
    let cachedCatalog = [];

    async function fetchCatalog() {
        try {
            const res = await fetch('https://api.themoviedb.org/3/movie/popular?api_key=347651bac020bf3af616287e853b4e92&language=ru-RU&page=1');
            const data = await res.json();
            if (data && data.results) {
                cachedCatalog = data.results;
                renderGrid(cachedCatalog);
            }
        } catch (e) {}
    }

    function renderGrid(list) {
        const c = document.getElementById('catalogGrid');
        c.innerHTML = '';
        list.forEach(m => {
            const title = m.title || 'Без названия';
            const poster = m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : '';
            if (!poster) return;

            const card = document.createElement('div');
            card.className = 'grid-card';
            card.innerHTML = `
                <img src="${poster}" alt="${title}">
                <div class="grid-card-info">
                    <div class="grid-card-title">${title}</div>
                </div>
            `;
            card.onclick = () => openPlayer(title);
            c.appendChild(card);
        });
    }

    function openPlayer(title) {
        document.getElementById('playerMediaTitle').innerText = title;
        document.getElementById('player-frame').src = `https://on.kinohub.vip/search?query=${encodeURIComponent(title)}`;
        document.getElementById('player-screen').style.display = 'flex';
    }

    function closePlayer() {
        document.getElementById('player-frame').src = 'about:blank';
        document.getElementById('player-screen').style.display = 'none';
    }

    fetchCatalog();
</script>
</body>
</html>
